      - text: San Salvador pupfish
        href: articles/pupfish.html
      - text: Darwin's finch community
        href: articles/finch-community.html
      - text: Darwin's finch annual selection
        href: articles/finches-year-by-year.html
    app:
      text: App
      href: https://lande.thestroudlab.com/app/

articles:
- title: Guide
  contents:
  - evolutionary-selection-analysis
- title: Case studies
  contents:
  - articles/bumpus-sparrows
  - articles/pupfish
  - articles/finch-community
  - articles/finches-year-by-year

reference:
- title: Prepare
  desc: Standardise the traits, relativise fitness and check the data
  contents:
  - prepare_selection_data
  - detect_family
  - check_selection_assumptions
